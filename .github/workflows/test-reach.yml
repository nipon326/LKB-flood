name: test-reach
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: curl multiple sources
        run: |
          for url in \
            "https://weather.bangkok.go.th/water/Summary" \
            "https://www.thaiwater.net/water/wl" \
            "https://nationalthaiwater.onwr.go.th/waterlevel" \
            "https://tiwrm.hii.or.th/thaiwater_l5/public/hydro" \
            "https://weather.bangkok.go.th/Images/Radar/radar.jpg" ; do
            echo "=== $url ==="
            curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 15 "$url" || echo "CURL FAILED $?"
          done
