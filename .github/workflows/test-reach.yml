name: test-reach
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: curl longdo incident.json
        run: curl -sS -o /dev/null -w "incident.json http=%{http_code} time=%{time_total}s\n" --max-time 15 https://traffic.longdo.com/incident.json || echo "CURL FAILED $?"
      - name: curl event image
        run: curl -sS -o /dev/null -w "event image http=%{http_code} time=%{time_total}s\n" --max-time 15 https://event.longdo.com/image/view/1039328 || echo "CURL FAILED $?"
